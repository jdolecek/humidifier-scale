name: Build firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: humidifier-scale
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned dependencies
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli lib install HX711@0.6.5
      - name: Compile
        working-directory: humidifier-scale
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: d1-mini-firmware
          path: humidifier-scale/build/*.bin
