# Two independent tanks, with one HX711 and two parallel cells per tank.
# Copy secrets.example.yaml to secrets.yaml and enter your own values.
# If adding this to a Device Builder-generated config, copy the sensor block
# and retain that device's existing Wi-Fi, API and OTA settings.
esphome:
  name: humidifier-scale
  friendly_name: Humidifier Scale
  min_version: 2026.9.0

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret humidifier_scale_api_key

ota:
  - platform: esphome
    encryption:  # Reuses the API encryption key (ESPHome 2026.9+).

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: hx711
    name: Left Tank Raw
    id: left_tank_raw
    dout_pin: GPIO14  # D5 -> left HX711 DT/DOUT
    clk_pin: GPIO12   # D6 -> left HX711 SCK/CLK
    gain: 128         # Channel A
    update_interval: 1s
    accuracy_decimals: 0
    unit_of_measurement: counts
    state_class: measurement
    icon: mdi:scale

  - platform: hx711
    name: Right Tank Raw
    id: right_tank_raw
    dout_pin: GPIO13  # D7 -> right HX711 DT/DOUT
    clk_pin: GPIO5    # D1 -> right HX711 SCK/CLK
    gain: 128         # Channel A
    update_interval: 1s
    accuracy_decimals: 0
    unit_of_measurement: counts
    state_class: measurement
    icon: mdi:scale
