# Copy to secrets.yaml and replace every placeholder; secrets.yaml is ignored.
# Use the API key generated by ESPHome Device Builder, or generate a new key:
# python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())'
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
humidifier_scale_api_key: "YOUR_32_BYTE_BASE64_API_KEY"
